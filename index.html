<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disarm Goliath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg">
    <div id="bg-image"></div>
    <div id="bg-overlay"></div>
  </div>
  <div id="grain"></div>
  <main id="container">
    <img id="logo" src="Images/logo.png" alt="Disarm Goliath">
    <div id="album-title"></div>
    <div id="countdown">
      <div class="time-block">
        <span class="time-number" id="days">00</span>
        <span class="time-label">Days</span>
      </div>
      <span class="time-sep">:</span>
      <div class="time-block">
        <span class="time-number" id="hours">00</span>
        <span class="time-label">Hours</span>
      </div>
      <span class="time-sep">:</span>
      <div class="time-block">
        <span class="time-number" id="minutes">00</span>
        <span class="time-label">Minutes</span>
      </div>
      <span class="time-sep">:</span>
      <div class="time-block">
        <span class="time-number" id="seconds">00</span>
        <span class="time-label">Seconds</span>
      </div>
    </div>
    <div id="final-reveal">
      <div class="reveal-title">Fighting Talk</div>
      <div class="reveal-subtitle">Coming Soon</div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
